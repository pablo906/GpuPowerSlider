name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional MAJOR.MINOR.PATCH version to publish (empty builds only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and run hardware-free tests
        shell: powershell
        run: .\build.ps1 -Test
      - name: Package
        shell: powershell
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $version = '0.0.0-dev'
          if ($env:RELEASE_VERSION) {
            if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected MAJOR.MINOR.PATCH' }
            $version = $env:RELEASE_VERSION
          } elseif ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a vMAJOR.MINOR.PATCH release tag' }
            $version = $env:REF_NAME.Substring(1)
          }
          .\scripts\package.ps1 -Version $version
      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence
          path: |
            artifacts/bin/test-output.txt
            artifacts/bin/test-results.txt
            artifacts/bin/preview*.png
          if-no-files-found: warn

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: release-package
      - name: Publish tested release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid release tag');
            const release = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `GPU Power Slider ${tag}`,
              body: 'Windows x64 portable build. Requires the separately installed, hash-pinned NvpwrControl 2.4.6 backend and its validated driver caches. Only GA403WW / RTX 5080 Laptop is supported. See README for setup and runtime behavior.\n\nThe build and 20 hardware-free controller/UI checks passed before publication. SHA256SUMS.txt covers the executable and ZIP. No backend, driver cache or local telemetry is bundled.',
              draft: true,
              prerelease: false
            });
            for (const name of fs.readdirSync('release-package')) {
              if (!name.endsWith('.zip') && name !== 'SHA256SUMS.txt') continue;
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.data.id,
                name,
                data: fs.readFileSync(path.join('release-package', name)),
                headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain'}
              });
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.data.id, draft: false
            });
